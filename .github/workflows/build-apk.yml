name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip zip git \
            python3 python3-pip python3-venv \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Unpack project
        run: |
          mkdir -p android_project
          unzip -o ether_trials_android_project.zip -d android_project
          find android_project -maxdepth 2 -type f | head -50

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3" buildozer

      - name: Build APK
        working-directory: android_project
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ether-Trials-Android-APK
          path: android_project/bin/*.apk
          if-no-files-found: error
