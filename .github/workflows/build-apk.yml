name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            unzip zip git \
            python3 python3-pip python3-venv \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Unpack project
        run: |
          rm -rf android_project
          mkdir -p android_project

          unzip -o ether_trials_android_v5_6_crashdebug_full.zip -d android_project

          PROJECT_DIR=$(find android_project -name buildozer.spec -printf '%h\n' | head -1)

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: buildozer.spec not found"
            find android_project -maxdepth 4 -type f | head -200
            exit 1
          fi

          sed -i 's/^requirements *=.*/requirements = python3==3.11.14,hostpython3==3.11.14,kivy/' "$PROJECT_DIR/buildozer.spec"
          sed -i 's/^android.archs *=.*/android.archs = arm64-v8a,x86_64/' "$PROJECT_DIR/buildozer.spec"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "===== BUILDOZER SETTINGS ====="
          grep -E '^(package.name|package.domain|requirements|android.api|android.minapi|android.archs)' \
            "$PROJECT_DIR/buildozer.spec" || true

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          rm -rf .buildozer
          buildozer -v android debug

      - name: Find APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find bin -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          FULL_APK="$PWD/$APK"

          echo "apk=$FULL_APK" >> "$GITHUB_OUTPUT"
          echo "APK: $FULL_APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          script: |
            echo "===== INSTALL APK ====="

            adb install -r "${{ steps.apk.outputs.apk }}"

            echo "===== CLEAR LOGCAT ====="

            adb logcat -c

            echo "===== START APP ====="

            adb shell am force-stop org.ethertrials.ethertrials || true

            adb shell monkey \
              -p org.ethertrials.ethertrials \
              -c android.intent.category.LAUNCHER \
              1 || true

            sleep 25

            echo "===== PROCESS CHECK ====="

            adb shell pidof org.ethertrials.ethertrials || true

            echo "===== IMPORTANT LOGS ====="

            adb logcat -d \
              | grep -Ei \
              'FATAL EXCEPTION|AndroidRuntime|PythonActivity|python|kivy|SDL|ethertrials|Traceback|Exception|SIGSEGV|signal 11|UnsatisfiedLinkError|ImportError|ModuleNotFoundError' \
              | tail -800 \
              | tee emulator-crash.txt

            echo "===== FULL LOGCAT ====="

            adb logcat -d | tail -2500 > emulator-logcat-full.txt

            echo "===== APP STATUS ====="

            if adb shell pidof org.ethertrials.ethertrials >/dev/null; then
              echo "APP_STILL_RUNNING=1" | tee -a emulator-crash.txt
            else
              echo "APP_CRASHED=1" | tee -a emulator-crash.txt
            fi

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ether-Trials-Emulator-Logs
          path: |
            emulator-crash.txt
            emulator-logcat-full.txt
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ether-Trials-Android-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
